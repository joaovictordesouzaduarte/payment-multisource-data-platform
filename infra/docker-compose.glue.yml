
services:
  glue:
    build:
      context: .
      dockerfile: Dockerfile.glue
    image: rtmsp-glue-local:5
    working_dir: /home/hadoop/workspace
    user: hadoop
    command: ["-c", "sleep infinity"]
    volumes:
      - ..:/home/hadoop/workspace
    environment:
      ICEBERG_CATALOG_TYPE: hadoop
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-${AWS_REGION:-us-east-1}}
    stdin_open: true
    tty: true
